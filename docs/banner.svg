<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="flop-pc-miner: mine on the FLOP devnet with your own NVIDIA PC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/><stop offset="1" stop-color="#0f1838"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#21c7f2" stop-opacity="0"/><stop offset=".5" stop-color="#21c7f2"/><stop offset="1" stop-color="#21c7f2" stop-opacity="0"/>
    </linearGradient>
    <style>
      .grid{stroke:#1b2a55;stroke-width:1}
      .spark{fill:none;stroke:#4fd1ff;stroke-width:3;stroke-linejoin:round;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 6s ease-in-out infinite}
      .pow{fill:none;stroke:#e6a93a;stroke-width:2;opacity:.85;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 6s ease-in-out .4s infinite}
      .dot{fill:#3ddc97;animation:pulse 1.6s ease-in-out infinite}
      .beam{animation:sweep 4s linear infinite}
      .tx{font:600 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3ddc97;opacity:0;animation:tx 6s ease-in-out infinite}
      .tx2{animation-delay:2s}.tx3{animation-delay:4s}
      @keyframes draw{0%{stroke-dashoffset:1400}55%,100%{stroke-dashoffset:0}}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
      @keyframes sweep{from{transform:translateX(-400px)}to{transform:translateX(1300px)}}
      @keyframes tx{0%,10%{opacity:0;transform:translateY(8px)}20%,70%{opacity:1;transform:none}85%,100%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <g class="grid"><path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/></g>
  <rect class="beam" x="0" y="0" width="260" height="300" fill="url(#beam)" opacity=".06"/>
  <circle class="dot" cx="72" cy="86" r="11"/>
  <text x="98" y="100" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="44" font-weight="700" fill="#ffffff">flop-pc-miner</text>
  <text x="74" y="146" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" fill="#9fb3d9">Mine on the FLOP devnet with your own NVIDIA PC · Windows + WSL2 · official images only</text>
  <path class="spark" d="M640 262 L670 250 L690 256 L705 214 L720 248 L745 240 L760 200 L778 246 L800 236 L820 208 L840 250 L862 238 L880 196 L900 244 L925 232 L945 210 L965 248 L990 236 L1010 202 L1030 246 L1055 238 L1075 214 L1100 250 L1130 242"/>
  <path class="pow" d="M640 284 L700 282 L720 274 L760 280 L800 270 L840 281 L880 268 L920 280 L960 272 L1000 282 L1040 270 L1080 280 L1130 276"/>
  <text class="tx" x="74" y="208">session SETTLED · 0.8138 FLOP · gn 134</text>
  <text class="tx tx2" x="74" y="238">session SETTLED · 0.2109 FLOP · gn 71</text>
  <text class="tx tx3" x="74" y="268">session SETTLED · 0.2376 FLOP · gn 80</text>
</svg>
